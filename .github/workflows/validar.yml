name: Validar Cuaderno del Artista
on:
  pull_request:
  push:
    branches: [main, feature/mejora-visual-premium-v2]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
