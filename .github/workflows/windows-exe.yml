name: Empaquetar Cuaderno del Artista Portable (Windows, macOS y Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/mejora-visual-premium-v2]

permissions:
  contents: write

jobs:
  build-portable:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows Portable (.exe 64-bit y 32-bit + Instalador)
            os: windows-latest
            platform: win
            artifact_name: Cuaderno-del-Artista-Windows-Portable
            file_glob: |
              release/*.exe
              release/*.zip
          - label: macOS Portable (.dmg y .zip Apple Silicon + Intel)
            os: macos-latest
            platform: mac
            artifact_name: Cuaderno-del-Artista-macOS-Portable
            file_glob: |
              release/*.dmg
              release/*.zip
          - label: Linux Portable (.AppImage y .tar.gz)
            os: ubuntu-latest
            platform: linux
            artifact_name: Cuaderno-del-Artista-Linux-Portable
            file_glob: |
              release/*.AppImage
              release/*.tar.gz

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verificar TypeScript sin errores
        run: npm run lint

      - name: Instalar Electron y electron-builder
        run: npm install --save-dev --legacy-peer-deps --no-audit --no-fund electron electron-builder

      - name: Compilar aplicación web Ultra-HD
        run: npm run build

      - name: Empaquetar versión portable para ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder.json --publish never

      - name: Subir instaladores y portables como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.file_glob }}
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: build-portable
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los ejecutables generados
        uses: actions/download-artifact@v4
        with:
          path: all-releases
          merge-multiple: true

      - name: Publicar versiones portables en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          name: Cuaderno del Artista — Versiones Portables (Windows, macOS y Linux)
          body: |
            ### Descarga directa multiplataforma (100% autónoma y portable)
            - **Windows (64 bits y 32 bits · Windows 10/11 y equipos anteriores):**
              - `Cuaderno-del-Artista-Windows-Portable-*-x64.exe` (Recomendado, abrir sin instalar — guarda tus datos en `Cuaderno-Datos/`).
              - `Cuaderno-del-Artista-Windows-Portable-*-ia32.exe` (Compatible con Windows de 32 bits).
              - `Cuaderno-del-Artista-Windows-Instalador-*-x64.exe` (Instalador clásico con icono en Escritorio y Menú Inicio).
              - `Cuaderno-del-Artista-Windows-Portable-*-x64.zip` (Carpeta portable descomprimible).
            - **macOS (Apple Silicon M1/M2/M3/M4 e Intel):** `.dmg` y `.zip` portable.
            - **Linux (x64 y ARM64):** `.AppImage` portable universal y `.tar.gz`.
          files: all-releases/*
          make_latest: true
